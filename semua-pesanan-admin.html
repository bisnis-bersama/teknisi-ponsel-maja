<!doctype html><html lang="id"><head><style>

  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;

</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semua Pesanan v6 WA Personal</title><style>
:root{--yellow:#ffcc00;--bg:#f1f2f4;--muted:#64756f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 system-ui,sans-serif}
.top{background:#111;color:#fff;padding:12px 16px 32px;border-radius:0 0 24px 24px}.topline{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.left{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:8px;background:#222;object-fit:cover;border:1px solid #333}
.brand{color:var(--yellow);font-weight:900;font-size:16px}.sub{color:#c7cbd0;font-size:11px}.sub-yellow{color:var(--yellow);font-size:12px;font-weight:800}
main{max-width:1100px;margin:-18px auto 0;padding:0 12px 80px}.panel{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 20px #0001}
.btn{border:0;border-radius:10px;background:var(--yellow);padding:9px 12px;font-weight:800;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:4px}.btn.dark{background:#111;color:var(--yellow)}.btn.green{background:#25d366;color:#fff}.btn.red{background:#fee;color:#b42318;border:1px solid #f5c6c1}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tabs button{border:1px solid #e5e7eb;border-radius:12px;padding:12px 8px;font-weight:800;font-size:12px;background:#f9f9f9;cursor:pointer}
.tabs button.active{background:#111;color:var(--yellow);border-color:var(--yellow)}
.list{display:grid;gap:10px}.item{border:1px solid #e5e7eb;border-radius:14px;padding:12px;background:#fff}.meta{font-size:11px;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hidden{display:none!important}.err{color:#b42318;background:#fdecea;border:1px solid #f5c6c1;border-radius:8px;padding:8px;font-size:12px}.ok{color:#087443;background:#e6f7ef;border:1px solid #c3ead7;border-radius:8px;padding:8px}
.log{font-size:11px;background:#111;color:#0f0;padding:8px;border-radius:8px;white-space:pre-wrap;max-height:100px;overflow:auto}
a.back{color:var(--yellow);text-decoration:none;font-weight:700;font-size:13px}
.status-badge{font-size:10px;font-weight:800;border-radius:999px;padding:4px 8px;background:#fff4c2;color:#6d5700}
</style></head><body>
<div class="top"><div class="topline"><div class="left"><img src="./logo2.png" class="logo" alt="logo" onerror="this.style.display='none'"><div><div class="brand">TOKO SIAP ANTAR</div><div id="accountNameTop" class="sub-yellow">Admin</div><div class="sub">Pesanan Filter + WA Personal</div></div></div><a class="back" href="./admin-dashboard-rapi-v3-logo-header.html">← Menu Admin</a></div></div>
<main>
<div class="panel"><h1 style="margin:0 0 6px">Semua Pesanan</h1><p style="margin:0;font-size:11px;color:var(--muted)">Hemat read + WA personal: Halo Kak (nama akun) ini dari Toko Siap Antar ...</p><div id="log" class="log"></div>
<div class="tabs">
<button id="tabMitra" onclick="filterStatus('menunggu_mitra')"><span>🟡 Menunggu Mitra</span><small id="countMitra">tap</small></button>
<button id="tabKurir" onclick="filterStatus('menunggu_kurir')"><span>🔵 Menunggu Kurir</span><small id="countKurir">tap</small></button>
<button id="tabSelesai" onclick="filterStatus('selesai')"><span>🟢 Selesai</span><small id="countSelesai">tap</small></button>
</div>
</div>
<div id="content" class="panel">Klik tombol status - baru load + WA personal sesuai tujuan</div>
</main>
<script type="module">
import {auth,db} from "./firebase-config.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {doc,getDoc,collection,getDocs,query,where,limit,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rupiah(n){return 'Rp '+(Number(n)||0).toLocaleString('id-ID');}
function log(m){ const el=$("log"); if(el) el.textContent+="\n"+m; }
function waLink(num){ if(!num) return null; let p=String(num).replace(/[^0-9]/g,''); if(p.startsWith('0')) p='62'+p.slice(1); if(!p.startsWith('62')) p='62'+p; return 'https://wa.me/'+p; }
async function loadAccountName(u){ try{ const s=await getDoc(doc(db,"users",u.uid)); const p=s.data(); if(p) $("accountNameTop").textContent="Halo, Kak, "+(p.nama||p.namaUsaha||u.email); }catch(e){} }
let currentUser=null;
onAuthStateChanged(auth, u=>{ currentUser=u; if(u) loadAccountName(u); });

window.filterStatus=async(key)=>{
  if(!currentUser){ $("content").innerHTML='<div class="err">Login</div>'; return; }
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  const map={menunggu_mitra:'tabMitra', menunggu_kurir:'tabKurir', selesai:'tabSelesai'};
  if(map[key]) $(map[key]).classList.add('active');
  $("content").innerHTML='Memuat '+key+'...';
  try{
    let q;
    if(key==='menunggu_mitra') q=query(collection(db,"orders"), where("status","==","menunggu_harga_mitra"), limit(30));
    else if(key==='menunggu_kurir') q=query(collection(db,"orders"), where("status","in",["menunggu_kurir","diterima_mitra","siap_antar"]), limit(30));
    else q=query(collection(db,"orders"), where("status","==","selesai"), limit(30));
    const snap=await getDocs(q);
    if(snap.empty){ $("content").innerHTML='<div class="ok">Tidak ada '+key+'</div>'; return; }
    let html='';
    for(const d of snap.docs){
      const o=d.data(); const id=d.id;
      const total=Number(o.total||0);
      let mitraPhone=o.mitraTelepon||''; let mitraNama=o.mitraNama||'Mitra';
      if(o.mitraUid){ try{ const ms=await getDoc(doc(db,"users",o.mitraUid)); const md=ms.data(); mitraPhone=md?.telepon||mitraPhone; mitraNama=md?.namaUsaha||md?.nama||mitraNama; }catch(e){} }
      let pelangganPhone=o.pelangganTelepon||''; let pelangganNama=o.pelangganNama||'Pelanggan';
      if(o.pelangganUid){ try{ const ps=await getDoc(doc(db,"users",o.pelangganUid)); const pd=ps.data(); pelangganPhone=pd?.telepon||pelangganPhone; pelangganNama=pd?.nama||pelangganNama; }catch(e){} }
      let kurirPhone=o.kurirTelepon||''; let kurirNama=o.kurirNama||'Kurir';
      if(o.kurirUid){ try{ const ks=await getDoc(doc(db,"users",o.kurirUid)); const kd=ks.data(); kurirPhone=kd?.telepon||kurirPhone; kurirNama=kd?.nama||kurirNama; }catch(e){} }
      
      // Personal WA messages sesuai tujuan
      const waMitraMsg = `Halo Kak ${mitraNama} ini dari Toko Siap Antar, ada pesanan ${o.nomorPesanan||id} dengan status ${key} menunggu harga mitra. Mohon segera input modalnya di aplikasi agar pesanan bisa lanjut ke kurir. Total ${rupiah(total)}. Terima kasih.`;
      const waPelangganMsg = `Halo Kak ${pelangganNama} ini dari Toko Siap Antar, pesanan Anda ${o.nomorPesanan||id} sedang ${key.replace('_',' ')}. Kami sedang proses, total ${rupiah(total)}. Mohon tunggu kurir kami. Terima kasih.`;
      const waKurirMsg = `Halo Kak ${kurirNama} ini dari Toko Siap Antar, ada pesanan ${o.nomorPesanan||id} status ${key} menunggu kurir. Mohon cek aplikasi untuk ambil pesanan. Total ${rupiah(total)}. Terima kasih.`;
      
      const linkMitra = mitraPhone? `https://wa.me/${String(mitraPhone).replace(/[^0-9]/g,'').replace(/^0/,'62')}?text=${encodeURIComponent(waMitraMsg)}` : '';
      const linkPelanggan = pelangganPhone? `https://wa.me/${String(pelangganPhone).replace(/[^0-9]/g,'').replace(/^0/,'62')}?text=${encodeURIComponent(waPelangganMsg)}` : '';
      const linkKurir = kurirPhone? `https://wa.me/${String(kurirPhone).replace(/[^0-9]/g,'').replace(/^0/,'62')}?text=${encodeURIComponent(waKurirMsg)}` : '';
      
      let actions='';
      if(key==='menunggu_mitra'){
        actions=`<div class="actions">${linkMitra? `<a class="btn green" href="${linkMitra}" target="_blank">📱 WA ${esc(mitraNama)}</a>`:''} ${linkPelanggan? `<a class="btn green" href="${linkPelanggan}" target="_blank">📱 WA ${esc(pelangganNama)}</a>`:''} <button class="btn" onclick="copyPesan(\`${waMitraMsg.replace(/`/g,'')}\`)">📋 Copy Pesan Mitra</button></div>`;
      }else if(key==='menunggu_kurir'){
        actions=`<div class="actions">${linkKurir? `<a class="btn green" href="${linkKurir}" target="_blank">📱 WA ${esc(kurirNama)}</a>`:''} ${linkMitra? `<a class="btn green" href="${linkMitra}" target="_blank">📱 WA ${esc(mitraNama)}</a>`:''}</div>`;
      }else{
        actions=`<div class="actions"><span class="status-badge">Settlement: ${esc(o.settlementStatus||'belum')}</span></div>`;
      }
      html+=`<div class="item"><strong>${esc(o.nomorPesanan||id)}</strong> - ${rupiah(total)} - Mitra: ${esc(mitraNama)}<br><span class="meta">Status: ${esc(key)} | ${o.createdAt?.toDate?.()?.toLocaleString?.()||''}</span>${actions}<div style="margin-top:6px;background:#f7f7f7;border-radius:8px;padding:6px;font-size:11px;color:#333"><b>Pesan WA:</b> Halo Kak ${esc(mitraNama)} ini dari Toko Siap Antar, ${key==='menunggu_mitra'? 'ada pesanan '+esc(o.nomorPesanan||id)+' menunggu harga mitra': 'status '+esc(key)}...</div></div>`;
    }
    $("content").innerHTML=`<div class="list">${html}</div>`;
  }catch(e){ $("content").innerHTML='<div class="err">'+esc(e.message)+'</div>'; log(e.message); }
}
window.copyPesan=(txt)=>{ navigator.clipboard.writeText(txt).then(()=>alert('Pesan disalin:\n'+txt)); }
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
