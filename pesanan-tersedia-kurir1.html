
<!doctype html>
<html lang="id"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}

</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pesanan Kurir - Tanpa Panel Petunjuk</title>
<style>
:root{--y:#ffcc00;--bg:#f2f2f2;--grab:#00B14F}*{box-sizing:border-box;margin:0;padding:0}body{font:13px/1.45 system-ui,sans-serif;background:var(--bg);padding-bottom:90px}
.top{background:#111;color:#fff;padding:14px 16px 18px;border-radius:0 0 22px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.logo{width:46px;height:46px;background:#fff;border-radius:12px;overflow:hidden;flex:0 0 46px;display:grid;place-items:center}
.logo img{width:100%;height:100%;object-fit:contain}
.brand{color:var(--y);font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px}.sub{font-size:11px;color:#c7cbd0;margin-top:2px}.hello{font-size:13px;font-weight:700;margin-top:4px}
.btn-keluar{margin-left:auto;background:#222;color:#fff;border:1px solid #333;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:8px;margin:8px 0 12px;overflow:auto}
.tab{border:1px solid #e0e0e0;background:#fff;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;flex:0 0 auto}
.tab.active{background:#111;color:var(--y);border-color:#111}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid #eee}
.empty{text-align:center;padding:30px 16px;color:#777;background:#fff;border-radius:18px;border:1px dashed #ddd}
.order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.no{font-weight:900;font-size:13px}.badge{font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px;background:#e6f7ef;color:#087443;border:1px solid #c3ead7}
.row{font-size:12px;color:#555;margin:3px 0}
.btn{border:0;border-radius:12px;padding:11px;font-weight:800;text-align:center;cursor:pointer;width:100%;font-size:13px;margin-top:8px}
.btn-dark{background:#111;color:var(--y)}.btn-green{background:var(--grab);color:#fff}.btn-yellow{background:var(--y);color:#111}
.bottom-3{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#111;border-top:3px solid var(--y);display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom))}
.bottom-3 a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#9aa5a0;text-decoration:none;font-size:10px;font-weight:700}.bottom-3 a .ico{width:26px;height:26px;background:#222;border-radius:9px;display:grid;place-items:center;font-size:15px;color:var(--y)}.bottom-3 a.active{color:var(--y)}.bottom-3 a.active .ico{background:var(--y);color:#111}
.debug{font-family:monospace;font-size:10px;color:#0f0;background:#111;padding:8px;border-radius:8px;margin-top:8px;display:none;white-space:pre-wrap}
</style></head><body>
<div class="top">
  <div class="logo"><img src="https://via.placeholder.com/100x100.png?text=TOKO" alt="logo"></div>
  <div>
    <div class="brand">🛵 TOKO SIAP ANTAR</div>
    <div class="sub">Pesanan Kurir 1 Halaman · Menunggu + Antar + Selesai</div>
    <div class="hello" id="hello">Halo, Kak, <span id="namaKurir">Kurir</span> · <span id="totalPesanan">0 pesanan</span></div>
  </div>
  <button class="btn-keluar" onclick="location.href='./index.html'">Keluar</button>
</div>

<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 2px 10px">
    <b style="font-size:14px">Pesanan Kamu</b>
    <span id="countTop" style="font-size:11px;color:#888;font-weight:700">0 pesanan</span>
  </div>

  <div class="tabs">
    <button class="tab active" data-filter="semua">📋 Semua</button>
    <button class="tab" data-filter="menunggu">🟡 Menunggu (Baru)</button>
    <button class="tab" data-filter="siap">🛵 Siap Antar / Dikirim</button>
    <button class="tab" data-filter="selesai">✅ Selesai Hari Ini</button>
  </div>

  <div id="list"></div>
  <div id="empty" class="empty" style="display:none">Tidak ada pesanan untuk filter ini.</div>

  <div class="card" style="margin-top:14px">
    <div style="display:flex;justify-content:space-between"><b>Riwayat Hari Ini</b><span id="countSelesai" style="font-size:11px;color:#888">0 pesanan</span></div>
    <div id="listSelesai" style="margin-top:8px;font-size:12px;color:#666">Belum ada yang selesai hari ini.</div>
  </div>
</div>

<nav class="bottom-3">
  <a href="#" class="active"><span class="ico">📦</span>Pesanan (1 Halaman)</a>
  <a href="./riwayat-kurir.html"><span class="ico">↻</span>Riwayat</a>
  <a href="./ewallet-kurir.html"><span class="ico">💳</span>E-Wallet</a>
</nav>

<script type="module">
import {auth, db} from "./firebase-config.js";
import {onAuthStateChanged, signOut} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {collection, query, where, onSnapshot, doc, getDoc, updateDoc, serverTimestamp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const $=id=>document.getElementById(id);
let allOrders=[], filter='semua', currentUser=null;

function render(){
  const list=$('list'), empty=$('empty');
  list.innerHTML='';
  let filtered=allOrders;
  if(filter==='menunggu') filtered=allOrders.filter(o=> (o.status||'').toLowerCase().includes('baru') || (o.status||'').toLowerCase().includes('menunggu') || o.status==='diterima_mitra');
  else if(filter==='siap') filtered=allOrders.filter(o=> ['dikirim','diantar','dalam pengantaran','siap antar','siap'].some(k=> (o.status||'').toLowerCase().includes(k)));
  else if(filter==='selesai') filtered=allOrders.filter(o=> (o.status||'').toLowerCase().includes('selesai'));

  $('countTop').textContent=filtered.length+' pesanan';
  if(filtered.length===0){ empty.style.display='block'; }
  else{ empty.style.display='none'; filtered.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).forEach(o=>{
    const el=document.createElement('div'); el.className='card';
    const id=o.id;
    const mitra=o.mitraNama||o.namaMitra||'-';
    const pelanggan=o.alamatPengiriman?.nama||o.pelangganNama||'-';
    const alamat=o.alamatPengiriman?.alamat||o.alamat||'-';
    const total=o.total||o.grandTotal||0;
    el.innerHTML=`
      <div class="order-head"><span class="no">#${o.nomorPesanan||id.slice(0,8)}</span><span class="badge">${o.status||'baru'}</span></div>
      <div class="row">Mitra: <b>${mitra}</b> • Pelanggan: <b>${pelanggan}</b></div>
      <div class="row">Alamat: ${alamat.slice(0,70)}</div>
      <div class="row">Total: <b>Rp ${Number(total).toLocaleString('id-ID')}</b> • Ongkir Rp ${Number(o.ongkir||0).toLocaleString('id-ID')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
        <button class="btn btn-dark" onclick="ambil('${id}')">📦 Ambil Pesanan Ini</button>
        <button class="btn btn-green" onclick="selesai('${id}')">✅ Selesai Antar + Masuk Saldo</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
        <button class="btn btn-yellow" onclick="tolak('${id}')">❌ Tolak</button>
        <button class="btn btn-dark" onclick="lacak('${id}')">📍 Lacak (GPS Kamu + Pelanggan)</button>
      </div>
    `;
    list.appendChild(el);
  }); }

  // riwayat hari ini
  const selesai=allOrders.filter(o=> (o.status||'').toLowerCase().includes('selesai'));
  $('countSelesai').textContent=selesai.length+' pesanan';
  $('listSelesai').innerHTML=selesai.length? selesai.map(o=>`#${o.nomorPesanan||o.id.slice(0,6)} • ${o.alamatPengiriman?.nama||''} • Rp ${Number(o.total||0).toLocaleString('id-ID')}`).join('<br>') : 'Belum ada yang selesai hari ini.';
}

window.ambil=async(id)=>{
  if(!currentUser) return;
  try{
    await updateDoc(doc(db,'orders',id), {status:'dikirim', kurirUid:currentUser.uid, kurirNama:currentUser.displayName||currentUser.email, diambilAt:serverTimestamp()});
    alert('Pesanan diambil!');
  }catch(e){alert(e.message);}
};
window.tolak=async(id)=>{
  if(!confirm('Tolak pesanan ini?')) return;
  try{ await updateDoc(doc(db,'orders',id), {status:'ditolak_kurir'}); }catch(e){alert(e.message);}
};
window.selesai=async(id)=>{
  if(!confirm('Selesai antar & masuk saldo?')) return;
  try{ await updateDoc(doc(db,'orders',id), {status:'selesai', selesaiAt:serverTimestamp()}); alert('Selesai! Saldo masuk.'); }catch(e){alert(e.message);}
};
window.lacak=(id)=>{ localStorage.setItem('last_order_id', id); location.href='./perjalanan-kurir.html?orderId='+id; };

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); filter=t.dataset.filter; render(); };
});

onAuthStateChanged(auth, async (u)=>{
  if(!u){ $('namaKurir').textContent='Belum login'; return; }
  currentUser=u;
  try{ const us=await getDoc(doc(db,'users',u.uid)); if(us.exists()){ $('namaKurir').textContent=us.data().nama||us.data().displayName||u.email; } else { $('namaKurir').textContent=u.email; } }catch{ $('namaKurir').textContent=u.email; }
  const col=collection(db,'orders');
  // kurir lihat semua order yang belum diambil atau yang dia ambil
  const q=query(col, where('status','in',['diterima_mitra','menunggu','baru','dikirim','dalam pengantaran']));
  onSnapshot(q, snap=>{
    allOrders=snap.docs.map(d=>({id:d.id, ...d.data()}));
    // plus yang kurirUid == uid (yang sudah diambil dia)
    render();
  });
  // juga dengar yang kurirUid == uid
  const q2=query(col, where('kurirUid','==',u.uid));
  onSnapshot(q2, snap=>{
    snap.docs.forEach(d=>{
      if(!allOrders.find(x=>x.id===d.id)) allOrders.push({id:d.id, ...d.data()});
    });
    render();
  });
});
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
