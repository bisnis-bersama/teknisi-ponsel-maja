</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kurir v3.6 Auto Saldo Masuk</title><style>
:root{--yellow:#ffcc00;--bg:#f1f2f4;--line:#e6e7e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 system-ui,sans-serif}
header{background:#111;color:#fff;padding:18px 16px 48px;border-radius:0 0 30px 30px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between}.brand{color:var(--yellow);font-weight:900}.sub{color:#c7cbd0;font-size:12px}
.logout{background:#222;border:1px solid #555;color:#fff;border-radius:12px;padding:9px 12px}
main{max-width:1100px;margin:-25px auto 0;padding:0 12px 90px}.panel{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 8px 22px #0001}
.btn{border:0;border-radius:11px;background:var(--yellow);padding:12px 16px;font-weight:900;cursor:pointer;font-size:14px;min-width:120px;text-align:center;touch-action:manipulation}
.btn:active{transform:scale(.97)}.btn.dark{background:#111;color:var(--yellow)}.btn.blue{background:#e6f0ff;color:#1741a6;border:1px solid #c3d3ff}.btn.green{background:#e6f7ef;color:#087443;border:1px solid #c3ead7}
.btn:disabled{opacity:.5}
.list{display:grid;gap:12px}.item{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}.itemtop{display:flex;justify-content:space-between;gap:8px}.status{background:#d1f7d6;color:#0a5c36;font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px}
.meta{font-size:12px;color:#666;margin-top:4px}.ongkir-box{background:#111;color:var(--yellow);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;margin:10px 0}.ongkir-box b{font-size:18px}
.loc-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;background:#f9fafb}
.products-box{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}.product-line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #eee}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hidden{display:none!important}.err{color:#b42318;font-size:12px;background:#fdecea;border:1px solid #f5c6c1;border-radius:8px;padding:8px;margin-top:8px;white-space:pre-wrap}.ok{color:#087443;font-size:12px;background:#e6f7ef;border:1px solid #c3ead7;border-radius:8px;padding:8px;margin-top:8px}
.log{font-size:11px;background:#111;color:#0f0;padding:8px;border-radius:8px;white-space:pre-wrap;margin-top:8px;max-height:180px;overflow:auto}
</style></head><body><header><div class="head"><div><div class="brand">TOKOTOKO SIAP ANTAR</div><div class="sub">Kurir v3.6 Auto Saldo</div></div><button id="logoutBtn" class="logout hidden">Keluar</button></div></header>
<main>
<section id="loginPanel" class="panel"><h1>Masuk Kurir</h1><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="btn" style="width:100%;margin-top:10px">Masuk</button></form><div id="loginMsg" class="err" style="display:none"></div></section>
<section id="app" class="hidden">
<div class="panel"><h1>Auto Saldo Masuk v3.6</h1><p class="muted" id="greeting"></p><div style="background:#d1f7d6;border:1px solid #8ee0a0;border-radius:12px;padding:10px;font-size:12px">v3.6: Klik Selesai Antar = otomatis ongkir masuk saldo kurir, modal masuk saldo mitra, laba masuk admin. Langsung cek E-Wallet.</div><div id="debug" class="log"></div></div>
<div class="panel"><h2>Siap Ambil</h2><div id="offerList" class="list"><div class="meta">Memuat...</div></div></div>
<div class="panel"><h2>Pesanan Aktif Saya</h2><div id="myList" class="list"><div class="meta">Memuat...</div></div></div>
</section></main>
<script type="module">
import {auth,db} from "./firebase-config.js";
import {onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {doc,getDoc,collection,getDocs,query,where,updateDoc,addDoc,serverTimestamp,arrayUnion,increment} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rupiah(n){return 'Rp '+(Number(n)||0).toLocaleString('id-ID');}
function log(msg){ const el=$("debug"); el.textContent+= "\n"+new Date().toLocaleTimeString()+" - "+msg; }
function buildGpsLink(lat,lng,link){ if(link) return link; if(lat&&lng) return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`; return ""; }
async function profileFor(u){ const s=await getDoc(doc(db,"users",u.uid)); if(s.exists()) return s.data(); throw Error("Profil kurir tidak ditemukan"); }
$("loginForm").addEventListener("submit",async e=>{ e.preventDefault(); try{ await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value); }catch(err){ const el=$("loginMsg"); el.style.display='block'; el.textContent="Login gagal: "+err.message; } });
$("logoutBtn").onclick=()=>signOut(auth);
let profile=null,userNow=null;
onAuthStateChanged(auth,async u=>{
  if(!u){ $("loginPanel").classList.remove("hidden");$("app").classList.add("hidden");$("logoutBtn").classList.add("hidden");return; }
  try{ userNow=u; profile=await profileFor(u); $("loginPanel").classList.add("hidden");$("app").classList.remove("hidden");$("logoutBtn").classList.remove("hidden"); $("greeting").textContent="Halo, "+(profile.nama||u.email); window.userNow=userNow; await loadKurir(); }catch(err){ $("loginMsg").style.display='block'; $("loginMsg").textContent=err.message; log("Auth error: "+err.message); }
});
async function getMitraInfo(order){
  let alamat=order.mitraAlamat||order.alamatMitra||""; let gpsLink=order.mitraGpsLink||order.gpsLinkMitra||""; let nama=order.mitraNama||"Mitra Usaha"; let tel=order.mitraTelepon||""; let lat=order.mitraLat||null; let lng=order.mitraLng||null;
  const mitraUid=order.mitraUid||order.mitraUsahaUid||order.acceptedByMitraUid;
  if((!alamat || !gpsLink) && mitraUid){
    try{ const msnap=await getDoc(doc(db,"users",mitraUid)); if(msnap.exists()){ const m=msnap.data(); if(!alamat) alamat=m.alamat||""; if(!gpsLink) gpsLink=m.gpsLink||m.mapsUrl||buildGpsLink(m.lat,m.lng,"")||""; if(nama==="Mitra Usaha") nama=m.namaUsaha||m.nama||nama; if(!tel) tel=m.telepon||m.noWA||""; } }catch(e){ log("Gagal baca mitra: "+e.message); }
  }
  if(!gpsLink) gpsLink=buildGpsLink(lat,lng,"");
  return {nama, alamat: alamat||"Alamat belum ada", gpsLink, tel, uid:mitraUid};
}
function getPelangganInfo(order){
  const alamat=order.alamat||order.alamatPengiriman?.alamat||"Alamat pelanggan belum ada";
  const nama=order.ownerName||order.namaPelanggan||"Pelanggan";
  const lat=order.lat||order.alamatPengiriman?.lat; const lng=order.lng||order.alamatPengiriman?.lng;
  const gpsLink=order.gpsLink||order.alamatPengiriman?.gpsLink||buildGpsLink(lat,lng,"")||"";
  const tel=order.teleponPelanggan||order.noWA||"";
  return {nama, alamat, gpsLink, tel};
}
function productRows(order){
  const items=Array.isArray(order.items)?order.items:[];
  return `<div class="products-box"><strong>Produk (${items.length} item)</strong>`+items.map(it=>`<div class="product-line"><span>${esc(it.nama||'Produk')}</span><span>x ${Number(it.qty||1)}</span></div>`).join('')+`</div>`;
}
async function renderCard(order, mode){
  const mitra=await getMitraInfo(order); const pelanggan=getPelangganInfo(order); const ongkir=Number(order.ongkir||0);
  const title=esc(order.nomorPesanan||order.id); const status=esc(order.status||order.statusPemenuhan||'');
  const mitraGpsBtn=mitra.gpsLink?`<a class="btn blue" href="${esc(mitra.gpsLink)}" target="_blank">GPS Mitra</a>`:`<span class="err">GPS belum ada</span>`;
  const pelangganGpsBtn=pelanggan.gpsLink?`<a class="btn blue" href="${esc(pelanggan.gpsLink)}" target="_blank">GPS Pelanggan</a>`:`<span class="err">GPS belum ada</span>`;
  const actionsHtml = mode==='offer'
    ? `<div class="actions"><button class="btn" onclick="window.takeOrder('${esc(order.id)}')">Ambil Pesanan Ini</button><button class="btn dark" onclick="window.declineOrder('${esc(order.id)}')">Tolak</button></div>`
    : `<div class="actions"><button class="btn green" onclick="window.pickedOrder('${esc(order.id)}')">Sudah Diambil</button><button class="btn" style="background:#ffcc00" onclick="window.deliveredOrder('${esc(order.id)}')">Selesai Antar + Masuk Saldo</button></div>`;
  return `<div class="item" id="card-${esc(order.id)}"><div class="itemtop"><strong>${title}</strong><span class="status">${status}</span></div><div class="meta">ID: ${esc(order.id)} | Mitra: ${esc(mitra.nama)} | Ongkir: ${rupiah(ongkir)}</div><div class="ongkir-box"><span>Ongkir Kurir</span><b>${rupiah(ongkir)}</b></div><div class="loc-card"><strong>AMBIL DI MITRA</strong><div>${esc(mitra.nama)}</div><div>${esc(mitra.alamat)}</div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">${mitraGpsBtn}</div></div><div class="loc-card"><strong>ANTAR KE PELANGGAN</strong><div>${esc(pelanggan.nama)}</div><div>${esc(pelanggan.alamat)}</div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">${pelangganGpsBtn}</div></div>${productRows(order)}${actionsHtml}<div id="msg-${esc(order.id)}"></div></div>`;
}
async function fetchOrders(){
  const found=new Map(), uid=userNow.uid;
  const qs=[
    query(collection(db,"orders"),where("statusPemenuhan","==","diterima_mitra")),
    query(collection(db,"orders"),where("status","==","diterima_mitra")),
    query(collection(db,"orders"),where("statusPemenuhan","==","menunggu_kurir")),
    query(collection(db,"orders"),where("statusPemenuhan","==","siap_diambil")),
    query(collection(db,"orders"),where("kurirDitawariUids","array-contains",uid)),
    query(collection(db,"orders"),where("kurirUid","==",uid)),
    query(collection(db,"orders"),where("assignedCourierUid","==",uid))
  ];
  for(const q of qs){ try{ const snap=await getDocs(q); snap.docs.forEach(d=>found.set(d.id,{id:d.id,...d.data()})); }catch(e){ log("Query gagal: "+e.message); } }
  return [...found.values()];
}
async function loadKurir(){
  const offerEl=$("offerList"), myEl=$("myList");
  offerEl.innerHTML='Memuat...'; myEl.innerHTML='Memuat...';
  try{
    const orders=await fetchOrders();
    const offers=orders.filter(o=>!(o.kurirUid||o.assignedCourierUid) && ['diterima_mitra','menunggu_kurir','siap_diambil','disetujui'].includes(String(o.status||o.statusPemenuhan||'').toLowerCase()));
    const mine=orders.filter(o=> (o.kurirUid===userNow.uid||o.assignedCourierUid===userNow.uid) && !['selesai','dibatalkan'].includes(String(o.status||'').toLowerCase()));
    log("Total: "+orders.length+" | Siap Ambil: "+offers.length+" | Aktif: "+mine.length);
    const offerHtml=await Promise.all(offers.map(o=>renderCard(o,'offer')));
    const myHtml=await Promise.all(mine.map(o=>renderCard(o,'my')));
    offerEl.innerHTML=offerHtml.length?offerHtml.join(''):'<div class="meta">Belum ada pesanan</div>';
    myEl.innerHTML=myHtml.length?myHtml.join(''):'<div class="meta">Belum ada aktif</div>';
  }catch(e){ offerEl.innerHTML='<div class="err">'+esc(e.message)+'</div>'; }
}
window.takeOrder = async function(id){
  const msgEl=document.getElementById('msg-'+id); const card=document.getElementById('card-'+id);
  if(card) card.querySelectorAll('button').forEach(b=>b.disabled=true);
  if(msgEl) msgEl.innerHTML='<div class="meta">Memproses...</div>';
  try{
    const ref=doc(db,"orders",id);
    const snap=await getDoc(ref);
    if(!snap.exists()) throw Error("Order tidak ditemukan");
    if(snap.data().kurirUid) throw Error("Sudah diambil");
    await updateDoc(ref,{kurirUid:userNow.uid,assignedCourierUid:userNow.uid,courierUid:userNow.uid,status:"dikirim",statusPengantaran:"diambil",statusKurir:"dalam_pengantaran",diambilKurirAt:serverTimestamp(),waktuDiambil:serverTimestamp(),updatedAt:serverTimestamp()});
    if(msgEl) msgEl.innerHTML='<div class="ok">Berhasil diambil!</div>';
    setTimeout(loadKurir, 800);
  }catch(e){ if(msgEl) msgEl.innerHTML=`<div class="err">Gagal: ${esc(e.message)}</div>`; if(card) card.querySelectorAll('button').forEach(b=>b.disabled=false); }
}
window.declineOrder = async function(id){
  const msgEl=document.getElementById('msg-'+id);
  try{ const ref=doc(db,"orders",id); await updateDoc(ref,{kurirDitolakUids:arrayUnion(userNow.uid),updatedAt:serverTimestamp()}); if(msgEl) msgEl.innerHTML='<div class="ok">Ditolak</div>'; setTimeout(loadKurir, 500); }catch(e){ if(msgEl) msgEl.innerHTML='<div class="err">Gagal: '+esc(e.message)+'</div>'; }
}
window.pickedOrder = async function(id){
  const msgEl=document.getElementById('msg-'+id);
  try{ const ref=doc(db,"orders",id); await updateDoc(ref,{statusPengantaran:"dalam_perjalanan",waktuDiambil:serverTimestamp(),updatedAt:serverTimestamp()}); if(msgEl) msgEl.innerHTML='<div class="ok">Sudah diambil</div>'; setTimeout(loadKurir, 500); }catch(e){ if(msgEl) msgEl.innerHTML='<div class="err">Gagal: '+esc(e.message)+'</div>'; }
}
window.deliveredOrder = async function(id){
  const msgEl=document.getElementById('msg-'+id); const card=document.getElementById('card-'+id);
  if(card) card.querySelectorAll('button').forEach(b=>b.disabled=true);
  if(msgEl) msgEl.innerHTML='<div class="meta">Memproses selesai + masuk saldo...</div>';
  log("Selesai+settlement: "+id);
  try{
    const orderRef=doc(db,"orders",id);
    const snap=await getDoc(orderRef);
    if(!snap.exists()) throw Error("Order tidak ditemukan");
    const order=snap.data();
    const ongkir=Number(order.ongkir||0);
    const mitraUid=order.mitraUid||order.mitraUsahaUid||order.acceptedByMitraUid;
    const mitraModalTotal=Number(order.mitraModalTotal||order.modalTotal||0);
    const totalJual=Number(order.total||0);
    let totalJualAsli=totalJual;
    try{ const pricingSnap=await getDoc(doc(db,"order_pricing",id)); if(pricingSnap.exists()){ const p=pricingSnap.data(); totalJualAsli=Number(p.totalJual||p.total||totalJual); } }catch(e){}
    const laba=Math.max(0, totalJualAsli - mitraModalTotal - ongkir);
    await updateDoc(orderRef,{status:"selesai",statusPengantaran:"selesai",statusKurir:"selesai",waktuSampai:serverTimestamp(),waktuSelesai:serverTimestamp(),settlementStatus:"auto_settled",labaAdmin:laba,updatedAt:serverTimestamp()});
    log(`Selesai ongkir ${ongkir} modal ${mitraModalTotal} jual ${totalJualAsli} laba ${laba}`);
    try{
      const kurirRef=doc(db,"users",userNow.uid);
      await updateDoc(kurirRef,{saldoEwallet: increment(ongkir),saldo: increment(ongkir),totalPendapatan: increment(ongkir),updatedAt: serverTimestamp()});
      await addDoc(collection(db,"wallet_transactions"),{uid:userNow.uid,type:"ongkir_kurir",amount:ongkir,orderId:id,nomorPesanan:order.nomorPesanan||id,description:`Ongkir ${order.nomorPesanan||id}`,createdAt:serverTimestamp()});
      log(`Ongkir ${ongkir} masuk kurir`);
    }catch(e){ log("Gagal saldo kurir: "+e.message); }
    if(mitraUid && mitraModalTotal>0){
      try{
        const mitraRef=doc(db,"users",mitraUid);
        await updateDoc(mitraRef,{saldoEwallet: increment(mitraModalTotal),saldo: increment(mitraModalTotal),totalPendapatan: increment(mitraModalTotal),updatedAt: serverTimestamp()});
        await addDoc(collection(db,"wallet_transactions"),{uid:mitraUid,type:"modal_mitra",amount:mitraModalTotal,orderId:id,nomorPesanan:order.nomorPesanan||id,description:`Modal ${order.nomorPesanan||id}`,createdAt:serverTimestamp()});
        log(`Modal ${mitraModalTotal} masuk mitra`);
      }catch(e){ log("Gagal saldo mitra: "+e.message); }
    }
    if(laba>0){
      try{
        const adminQ=query(collection(db,"users"),where("role","in",["admin","superadmin"]),where("status","==","aktif"));
        const adminSnap=await getDocs(adminQ);
        if(!adminSnap.empty){
          const adminDoc=adminSnap.docs[0];
          const adminRef=doc(db,"users",adminDoc.id);
          await updateDoc(adminRef,{saldoEwallet: increment(laba),saldo: increment(laba),totalPendapatan: increment(laba),updatedAt: serverTimestamp()});
          await addDoc(collection(db,"wallet_transactions"),{uid:adminDoc.id,type:"laba_admin",amount:laba,orderId:id,nomorPesanan:order.nomorPesanan||id,description:`Laba ${order.nomorPesanan||id}`,createdAt:serverTimestamp()});
          log(`Laba ${laba} masuk admin`);
        }
      }catch(e){ log("Gagal saldo admin: "+e.message); }
    }
    if(msgEl) msgEl.innerHTML=`<div class="ok">Selesai!<br>Ongkir Rp ${ongkir.toLocaleString('id-ID')} masuk saldo kurir<br>Modal Rp ${mitraModalTotal.toLocaleString('id-ID')} masuk mitra<br>Laba Rp ${laba.toLocaleString('id-ID')} masuk admin<br>Cek E-Wallet!</div>`;
    setTimeout(loadKurir, 1500);
  }catch(e){
    if(msgEl) msgEl.innerHTML=`<div class="err">Gagal: ${esc(e.message)}</div>`;
    log("Gagal: "+e.message);
    if(card) card.querySelectorAll('button').forEach(b=>b.disabled=false);
  }
}
